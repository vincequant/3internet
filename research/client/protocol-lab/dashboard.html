<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三国志 · 实时游戏列表</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1420;color:#e8edf6}*{box-sizing:border-box}body{margin:0;padding:48px 30px}main{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;letter-spacing:-1px;margin:8px 0 12px}.eyebrow{color:#e4b96b;font-size:12px;letter-spacing:3px}.sub{color:#94a5bd;font-size:14px;line-height:1.8}.badge{border:1px solid #2d655e;background:#153530;color:#8ce0c4;padding:10px 15px;border-radius:40px;white-space:nowrap;font-size:13px}.badge.busy{background:#142e4a;border-color:#285581;color:#8bc7ff}.badge.error{background:#44232a;border-color:#713f45;color:#ffb0b0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:32px 0 24px}.stat{padding:23px;background:#151f30;border:1px solid #263347;border-radius:15px}.stat small{display:block;color:#93a4bc;font-size:12px;margin-bottom:12px}.stat strong{font-size:25px;font-weight:600}.stat span{font-size:13px;color:#93a4bc;margin-left:8px}.panel{border:1px solid #29374b;border-radius:17px;overflow:hidden;background:#121c2b}.panel-head{padding:22px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #29374b}.panel-head h2{font-size:17px;margin:0}.panel-head span{color:#94a5bd;font-size:12px}table{border-collapse:collapse;width:100%;text-align:left}th{color:#8497af;font-size:12px;font-weight:500;padding:16px 22px}td{padding:23px 22px;border-top:1px solid #223047;font-size:15px}.room-name{font-weight:600;font-size:18px}.players{color:#8ce0c4;font-size:19px}.empty{text-align:center;padding:65px 24px;color:#97aac2;line-height:1.8}.notice{padding:17px 22px;font-size:12px;color:#92a5bf;background:#101927;border-top:1px solid #263347;line-height:1.8}.events{margin-top:26px}.events h3{font-size:13px;font-weight:500;color:#92a5bf}.event{padding:11px 0;border-bottom:1px solid #202c3d;font-size:13px;color:#becbdd}.event time{color:#7389a5;display:inline-block;margin-right:22px}footer{margin-top:28px;font-size:12px;line-height:1.9;color:#70859f}.stale{color:#e4b96b!important}@media(max-width:620px){body{padding:25px 14px}header{align-items:flex-start;flex-direction:column}h1{font-size:27px}.stats{gap:8px}.stat{padding:15px 12px}.stat strong{font-size:19px}td,th{padding:17px 11px}.room-name{font-size:15px}.panel-head{flex-direction:column}.id{display:none}}
</style>
<main><header><div><div class="eyebrow">三国志 INTERNET</div><h1>实时游戏列表</h1><div class="sub">三国对战房 / 多线2（主线） · 监控账号 <b id="account">abcde</b></div></div><div class="badge busy" id="status">正在连接监控</div></header>
<section class="stats"><div class="stat"><small>可见房间</small><strong id="count">—</strong><span>个</span></div><div class="stat"><small>最近成功查询</small><strong id="updated">—</strong></div><div class="stat"><small>自动刷新间隔</small><strong>30</strong><span>秒</span></div></section>
<section class="panel"><div class="panel-head"><h2>游戏房间</h2><span id="detail">首次查询约需 12 秒</span></div><table id="table" hidden><thead><tr><th>房间名称</th><th>房主</th><th>人数</th><th class="id">房间编号</th></tr></thead><tbody id="rooms"></tbody></table><div class="empty" id="empty">正在登录小号并查询多线2…</div><div class="notice">显示最近一次收到的房间与人数。未收到回应不一定代表没有房间；房间从列表消失也不能直接判断为已经开局。</div></section>
<section class="events"><h3>列表变化记录</h3><div id="events"><div class="event">等待首次结果</div></div></section><footer>数据采集：VKQUANT-COM Mac · 页面打开时自动查询，关闭页面后停止新增查询。<br>显示时间为你的本地时间。此页面不会加入房间或启动对局。</footer></main>
<script>
const el=id=>document.getElementById(id);let previous='',lastGood=0;
const clock=t=>new Date(t*1000).toLocaleTimeString('zh-CN',{hour12:false});
function cell(row,text,cls){const td=document.createElement('td');td.textContent=text;if(cls)td.className=cls;row.append(td)}
async function update(){try{const r=await fetch('/api',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();lastGood=Date.now();el('account').textContent=s.account;const age=s.observed_at?Date.now()/1000-s.observed_at:0;const stale=age>65;el('status').className='badge '+(s.phase==='error'?'error':s.phase==='querying'?'busy':'');el('status').textContent=s.phase==='error'?s.error:s.phase==='querying'?'正在刷新列表':stale?'数据待更新':s.observed_at?'自动更新中':'准备查询';el('updated').textContent=s.observed_at?clock(s.observed_at):'—';el('updated').className=stale?'stale':'';el('count').textContent=s.observed_at?s.rooms.length:'—';el('detail').textContent=s.observed_at?`${stale?'上次数据 · ':''}${Math.max(0,Math.round(age))} 秒前更新 · 查询耗时 ${((s.elapsed_ms||0)/1000).toFixed(1)} 秒`:'首次查询约需 12 秒';const key=JSON.stringify([s.observed_at,s.history,s.phase,s.error]);if(key!==previous){previous=key;el('table').hidden=!s.rooms.length;el('empty').hidden=!!s.rooms.length;el('empty').textContent=s.phase==='error'?s.error:s.observed_at?'本轮未收到游戏房间回应。页面会继续自动刷新。':'正在登录小号并查询多线2…';el('rooms').replaceChildren();for(const room of s.rooms){const row=document.createElement('tr');cell(row,room.name,'room-name');cell(row,room.host);cell(row,`${room.current} / ${room.maximum}`,'players');cell(row,room.id,'id');el('rooms').append(row)}el('events').replaceChildren();for(const event of s.history){const div=document.createElement('div');div.className='event';const time=document.createElement('time');time.textContent=clock(event.at);div.append(time,document.createTextNode(event.text+(event.rooms.length?' · '+event.rooms.map(x=>`${x.name} ${x.current}/${x.maximum}`).join('，'):'')));el('events').append(div)}}}catch(e){el('status').className='badge error';el('status').textContent='监控连接中断';el('detail').textContent='当前内容为上次数据，正在尝试恢复连接'}setTimeout(update,2000)}update();
</script></html>
